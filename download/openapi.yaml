components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        API key authentication for server-to-server calls.

        Pass the key in the `Authorization` header as a Bearer token:

        ```
        Authorization: Bearer sk_live_...
        ```

        Keys are issued in the [dashboard](https://musicosy.com/dashboard/keys).
        The raw secret is shown **once** at creation time. Only the SHA-256
        hash is stored at rest.

        - Production keys: `sk_live_` prefix
        - Sandbox keys: `sk_test_` prefix
        - Total length: 51 chars
        - Lifecycle: create → use → roll → revoke
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT authentication for end-user browser sessions (dashboard only).

        **Not accepted by `/v1/*` endpoints.** Only valid for
        `/api/dashboard/*` and `/api/me` routes. Issued by Supabase Auth
        when a user signs in to the dashboard.

  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum number of results to return
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor for pagination
    DateRangeParam:
      name: dateRange
      in: query
      schema:
        type: string
        enum: [7d, 30d, 90d, 1y]
        default: 30d
      description: Date range for analytics
    ProfileIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Profile ID
    AssetIdParam:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Asset ID
    StreamIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Stream ID

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limited
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PaymentRequired:
      description: Payment required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ============================================================
    # COMMON SCHEMAS
    # ============================================================

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true

    Pagination:
      type: object
      properties:
        limit:
          type: integer
        nextCursor:
          type: string
        hasMore:
          type: boolean
        total:
          type: integer

    Money:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
          enum: [USD, EUR, GBP, JPY, CAD, AUD]

    Address:
      type: object
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string

    DateRange:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      example:
        success: true

    UpdateResponse:
      type: object
      properties:
        updated:
          type: boolean
      example:
        updated: true

    ProfileSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar:
          type: string
        verified:
          type: boolean
        relationshipLevel:
          type: string
          enum: [listener, follower, fan, connection, subscriber]

    # ============================================================
    # D1: IDENTITY & SOCIAL GRAPH
    # ============================================================

    RegisterRequest:
      type: object
      required: [email, password, displayName]
